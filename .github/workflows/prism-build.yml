name: Build Prism Menu 2.2091 (Android64)

# Compila Prism Menu para Android64 y GD 2.2091. Mismo esquema que globed-build.yml:
# SDK v6 + bindings fijadas, loader compilado para enlazar.

on:
  workflow_dispatch:
    inputs:
      mod_repo:
        description: 'Repo del mod (owner/repo)'
        default: 'FireMario211/Prism-Menu'
      mod_ref:
        description: 'Rama, tag o commit (vacio = rama por defecto)'
        default: ''
  push:
    branches:
      - "**"

env:
  GD_VERSION: "2.2091"
  GD_COMP_VERSION: "22091"
  GEODE_REF: "v6"
  BINDINGS_REF: "d73aadd"
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de Prism Menu
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mod_repo || 'FireMario211/Prism-Menu' }}
          ref: ${{ inputs.mod_ref || '' }}
          path: mod_src

      - name: Apuntar mod.json a GD 2.2091
        shell: bash
        run: |
          cd mod_src
          python3 - <<'PY'
          import os, re
          v = os.environ["GD_VERSION"]
          s = open("mod.json", encoding="utf-8").read()
          n = re.sub(r'("android(?:32|64)?"\s*:\s*)"[^"]*"', r'\1"%s"' % v, s)
          open("mod.json", "w", encoding="utf-8").write(n)
          print(re.search(r'"gd"\s*:\s*\{[^}]*\}', n).group(0))
          PY

      - name: Parchear fuentes (genericos)
        shell: bash
        run: |
          python3 - mod_src <<'PY'
          import sys, glob, os
          root = sys.argv[1]
          n = 0
          for ext in ("cpp", "hpp", "h", "mm"):
              for f in glob.glob(f"{root}/**/*.{ext}", recursive=True):
                  if "/build/" in f or "/cpm-cache/" in f:
                      continue
                  try:
                      t = open(f, encoding="utf-8").read()
                  except Exception:
                      continue
                  if "gd::string" in t:
                      open(f, "w", encoding="utf-8").write(t.replace("gd::string", "std::string")); n += 1
          print("archivos con gd::string ->", n)
          import re
          def sub(rel, pairs, regex=False):
              p = f"{root}/{rel}"
              if not os.path.isfile(p):
                  print("NO EXISTE", rel); return
              t = open(p, encoding="utf-8").read(); o = t
              for a, b in pairs:
                  if regex:
                      t, k = re.subn(a, b, t)
                  else:
                      k = t.count(a); t = t.replace(a, b)
                  if not k: print("  (sin cambios en", rel, "):", a[:60])
              if t != o:
                  open(p, "w", encoding="utf-8").write(t); print("parcheado", rel)

          # GD 2.2091 trae su propia clase Dropdown y Geode v6 trae geode::Label: se renombran las de Prism
          for ext in ("cpp", "hpp", "h"):
              for f in glob.glob(f"{root}/src/**/*.{ext}", recursive=True):
                  t = open(f, encoding="utf-8").read(); o = t
                  t = re.sub(r'(?<![\w:"/])Dropdown(?![\w."])', "PrismDropdown", t)
                  t = re.sub(r'(?<![\w:"/])Label(?![\w."])', "PrismLabel", t)
                  if t != o:
                      open(f, "w", encoding="utf-8").write(t); print("renombrado en", f)

          # geode::Task ya no existe (el alias FileEvent no se usa)
          sub("src/UI/PrismUI.hpp", [("using FileEvent = Task<Result<std::filesystem::path>>;", "")])
          # getSaveDir() devuelve asp::fs::Path
          sub("src/main.cpp", [("auto currentSave = Mod::get()->getSaveDir();", "std::filesystem::path currentSave = Mod::get()->getSaveDir().string();"),
                               ("bool init(GJGameLevel *p0, bool p1, bool p2) {", "bool init(GJGameLevel *p0, bool p1) {"),
                               ("PlayLayer::init(p0,p1,p2)", "PlayLayer::init(p0,p1)")])
          # Boton en el menu de pausa: no depender del ID "center-button-menu" (Node IDs puede no haberlo puesto) y
          # opciones para mostrarlo en pausa / dentro del nivel
          sub("src/main.cpp", [
              ("if (!Mod::get()->getSettingValue<bool>(\"hide-button\")) {\n            if (auto menu = this->getChildByID(\"center-button-menu\")) {\n                auto button = PrismButton::createButton(this);\n                menu->addChild(button);\n                menu->reorderChild(button, -1);\n                menu->updateLayout();\n            }\n        }",
               "if (!Mod::get()->getSettingValue<bool>(\"hide-button\") && Mod::get()->getSettingValue<bool>(\"button-in-pause\")) {\n            if (auto menu = this->getChildByID(\"center-button-menu\")) {\n                auto button = PrismButton::createButton(this);\n                menu->addChild(button);\n                menu->reorderChild(button, -1);\n                menu->updateLayout();\n            } else {\n                auto winSize = CCDirector::get()->getWinSize();\n                auto fallbackMenu = CCMenu::create();\n                fallbackMenu->setPosition({winSize.width - 32.f, 32.f});\n                fallbackMenu->addChild(PrismButton::createButton(this));\n                this->addChild(fallbackMenu, 10);\n            }\n        }"),
              ("if (!PlayLayer::init(p0,p1)) return false;\n        if (prismButton != nullptr && Hacks::isHackEnabled(\"Show Button\")) prismButton->setVisible(false);",
               "if (!PlayLayer::init(p0,p1)) return false;\n        if (prismButton != nullptr && Hacks::isHackEnabled(\"Show Button\") && !Mod::get()->getSettingValue<bool>(\"button-in-level\")) prismButton->setVisible(false);"),
          ])
          sub("mod.json", [
              ('"hide-button": {',
               '"button-in-pause": {\n\t\t\t"name": "Button in Pause Menu",\n\t\t\t"description": "Shows the Prism Menu button in the pause menu.",\n\t\t\t"type": "bool",\n\t\t\t"default": true\n\t\t},\n\t\t"button-in-level": {\n\t\t\t"name": "Button in Level",\n\t\t\t"description": "Keeps the floating Prism Menu button visible while playing a level. (Requires Show Button enabled in the menu)",\n\t\t\t"type": "bool",\n\t\t\t"default": false\n\t\t},\n\t\t"hide-button": {')])
          # Nuevo hack "No Wave Trail Behind": oculta el trail blanco/translucido que el juego dibuja detras de la wave
          sub("src/Hacks/Player.cpp", [
              ("if (!Hacks::isHackEnabled(\"Solid Wave Trail\")) return CCDrawNode::drawPolygon(p0,p1,p2,p3,p4);",
               "if (Hacks::isHackEnabled(\"No Wave Trail Behind\") && p2.r == 1.F && p2.g == 1.F && p2.b == 1.F && p2.a != 1.F) return true;\n        if (!Hacks::isHackEnabled(\"Solid Wave Trail\")) return CCDrawNode::drawPolygon(p0,p1,p2,p3,p4);")])
          sub("resources/hacks/player.json", [
              ('        "name": "Solid Wave Trail",',
               '        "name": "No Wave Trail Behind",\n        "desc": "Hides the white trail the game draws behind the wave (not the colored trail).",\n        "type": "bool",\n        "platforms": ["win","android32","android64"]\n    },\n    {\n        "name": "Solid Wave Trail",')])
          # Wave: en 2.2091 la wave se dibuja con HardStreak::appendQuad (dos pasadas: ancha translucida "detras" y fina),
          # no con CCDrawNode::drawPolygon. Se hookea appendQuad para ocultar la ancha y/o cambiar el color.
          with open(f"{root}/src/Hacks/Player.cpp", "a", encoding="utf-8") as fh:
              fh.write("""
          // Wave trail (2.2091): la wave se dibuja en 2 pasadas: ancha con el color del jugador y fina BLANCA (ccWHITE fijo).
          // No Wave Trail Behind / Solid Wave Trail ocultan la blanca; Solid ademas usa mezcla normal. Custom Wave Trail Color cambia el color.
          class $modify(PrismWaveTrail, HardStreak) {
              void appendQuad(cocos2d::CCPoint const* pts, cocos2d::ccColor4F const& color) {
                  bool solid = Hacks::isHackEnabled("Solid Wave Trail");
                  static int prismLogCount = 0;
                  if (prismLogCount < 6) {
                      prismLogCount++;
                      geode::log::info("[Prism] appendQuad #{} color=({:.2f},{:.2f},{:.2f},{:.2f}) w={:.2f} base={:.2f} solid={} behind={}",
                          prismLogCount, color.r, color.g, color.b, color.a, ccpDistance(pts[0], pts[1]), m_waveSize * m_pulseSize,
                          solid, Hacks::isHackEnabled("No Wave Trail Behind"));
                  }
                  if (solid || Hacks::isHackEnabled("No Wave Trail Behind")) {
                      bool white = color.r >= 0.9f && color.g >= 0.9f && color.b >= 0.9f;
                      if (white) {
                          // la pasada blanca usa ccWHITE fijo; los anchos pueden quedar recortados (mini wave), asi que se oculta por color.
                          // Solo si el icono es blanco se distingue por ancho (la blanca es la fina, la ancha mide 3x).
                          auto nc = this->getColor();
                          bool nodeWhite = nc.r >= 230 && nc.g >= 230 && nc.b >= 230;
                          if (!nodeWhite) return;
                          float w = ccpDistance(pts[0], pts[1]);
                          float base = m_waveSize * m_pulseSize;
                          if (base <= 0.f || w <= base * 4.f) return;
                      }
                  }
                  if (solid) {
                      cocos2d::ccBlendFunc blend = { 1, 0x0303 }; // GL_ONE, GL_ONE_MINUS_SRC_ALPHA
                      this->setBlendFunc(blend);
                  }
                  if (Hacks::isHackEnabled("Custom Wave Trail Color")) {
                      auto r = Hacks::getHack("Wave Trail Red");
                      auto g = Hacks::getHack("Wave Trail Green");
                      auto b = Hacks::getHack("Wave Trail Blue");
                      if (r && g && b) {
                          cocos2d::ccColor4F c = color;
                          c.r = r->value.intValue / 255.f;
                          c.g = g->value.intValue / 255.f;
                          c.b = b->value.intValue / 255.f;
                          return HardStreak::appendQuad(pts, c);
                      }
                  }
                  HardStreak::appendQuad(pts, color);
              }
          };
          """)
          sub("resources/hacks/player.json", [
              ('        "name": "Solid Wave Trail",',
               '        "name": "Custom Wave Trail Color",\n        "desc": "Uses the color set below for the wave trail.",\n        "type": "bool",\n        "platforms": ["win","android32","android64"]\n    },\n    {\n        "name": "Wave Trail Red",\n        "desc": "Red value (0-255) of the custom wave trail color.",\n        "type": "int",\n        "min": 0,\n        "max": 255,\n        "step": 1,\n        "default": 255,\n        "platforms": ["win","android32","android64"]\n    },\n    {\n        "name": "Wave Trail Green",\n        "desc": "Green value (0-255) of the custom wave trail color.",\n        "type": "int",\n        "min": 0,\n        "max": 255,\n        "step": 1,\n        "default": 0,\n        "platforms": ["win","android32","android64"]\n    },\n    {\n        "name": "Wave Trail Blue",\n        "desc": "Blue value (0-255) of the custom wave trail color.",\n        "type": "int",\n        "min": 0,\n        "max": 255,\n        "step": 1,\n        "default": 0,\n        "platforms": ["win","android32","android64"]\n    },\n    {\n        "name": "Solid Wave Trail",')])
          # Start Pos Switcher (pestana Creator): archivo nuevo + entrada del hack
          with open(f"{root}/src/Hacks/StartPos.cpp", "w", encoding="utf-8") as fh:
              fh.write("""
          #include <Geode/Geode.hpp>
          #include <Geode/modify/PlayLayer.hpp>
          #include <algorithm>
          #include <vector>
          #include "../hacks.hpp"
          using namespace geode::prelude;

          // Offsets verificados en libcocos2dcpp.so de 2.2091 (android64) desensamblando PlayLayer::switchToStartPosObject
          // y GJBaseGameLayer::getStartPosObjectsForCurrentMode: m_startPosObject = +0x3090, m_startPosObjects = +0x3098.
          static std::vector<StartPosObject*> prismGetStartPositions(GJBaseGameLayer* layer) {
              std::vector<StartPosObject*> result;
              auto arr = *reinterpret_cast<CCArray**>(reinterpret_cast<uintptr_t>(layer) + 0x3098);
              if (!arr) return result;
              for (unsigned int i = 0; i < arr->count(); i++) {
                  if (auto obj = typeinfo_cast<StartPosObject*>(arr->objectAtIndex(i))) result.push_back(obj);
              }
              std::sort(result.begin(), result.end(), [](StartPosObject* a, StartPosObject* b) {
                  return a->getPositionX() < b->getPositionX();
              });
              return result;
          }

          static StartPosObject* prismGetCurrentStartPos(GJBaseGameLayer* layer) {
              return *reinterpret_cast<StartPosObject**>(reinterpret_cast<uintptr_t>(layer) + 0x3090);
          }

          // Start Pos Switcher: flechas dentro del nivel (solo si el nivel tiene StartPos y el hack esta activado, tambien en pleno nivel)
          class $modify(PrismStartPosPlayLayer, PlayLayer) {
              struct Fields {
                  CCMenu* menu = nullptr;
                  CCLabelBMFont* label = nullptr;
              };

              void setupHasCompleted() {
                  PlayLayer::setupHasCompleted();

                  auto winSize = CCDirector::get()->getWinSize();
                  auto menu = CCMenu::create();
                  menu->setPosition({winSize.width / 2.f, 24.f});
                  menu->setID("prism-startpos-switcher");
                  menu->setVisible(false);
                  menu->setEnabled(false);

                  auto leftSpr = CCSprite::createWithSpriteFrameName("GJ_arrow_01_001.png");
                  leftSpr->setScale(.55f);
                  auto leftBtn = CCMenuItemSpriteExtra::create(leftSpr, this, menu_selector(PrismStartPosPlayLayer::onPrevStartPos));
                  leftBtn->setPosition({-45.f, 0.f});
                  menu->addChild(leftBtn);

                  auto rightSpr = CCSprite::createWithSpriteFrameName("GJ_arrow_01_001.png");
                  rightSpr->setScale(.55f);
                  rightSpr->setFlipX(true);
                  auto rightBtn = CCMenuItemSpriteExtra::create(rightSpr, this, menu_selector(PrismStartPosPlayLayer::onNextStartPos));
                  rightBtn->setPosition({45.f, 0.f});
                  menu->addChild(rightBtn);

                  m_fields->label = CCLabelBMFont::create("0/0", "bigFont.fnt");
                  m_fields->label->setScale(.45f);
                  m_fields->label->setOpacity(200);
                  menu->addChild(m_fields->label);

                  m_fields->menu = menu;
                  this->addChild(menu, 100);
                  this->schedule(schedule_selector(PrismStartPosPlayLayer::checkStartPosUI), 0.2f);
                  this->checkStartPosUI(0.f);
              }

              // muestra u oculta las flechas segun el hack (activable/desactivable en pleno nivel) y si hay StartPos
              void checkStartPosUI(float) {
                  if (!m_fields->menu) return;
                  auto list = prismGetStartPositions(this);
                  bool show = Hacks::isHackEnabled("Start Pos Switcher") && !list.empty();
                  m_fields->menu->setVisible(show);
                  m_fields->menu->setEnabled(show);
                  if (show) this->updateStartPosLabel(list);
              }

              void updateStartPosLabel(std::vector<StartPosObject*> const& list) {
                  if (!m_fields->label) return;
                  auto cur = prismGetCurrentStartPos(this);
                  int idx = -1;
                  for (size_t i = 0; i < list.size(); i++) if (list[i] == cur) idx = static_cast<int>(i);
                  m_fields->label->setString(fmt::format("{}/{}", idx + 1, list.size()).c_str());
              }

              void onPrevStartPos(CCObject*) { this->switchStartPos(-1); }
              void onNextStartPos(CCObject*) { this->switchStartPos(1); }

              void switchStartPos(int dir) {
                  auto list = prismGetStartPositions(this);
                  int n = static_cast<int>(list.size());
                  if (n == 0) return;
                  auto cur = prismGetCurrentStartPos(this);
                  int idx = -1;
                  for (int i = 0; i < n; i++) if (list[i] == cur) idx = i;
                  idx += dir;
                  if (idx < -1) idx = n - 1;
                  if (idx >= n) idx = -1;
                  this->switchToStartPosObject(idx >= 0 ? list[idx] : nullptr);
                  this->updateStartPosLabel(list);
              }
          };
          """)
          sub("resources/hacks/creator.json", [
              ('"name": "Copy Hack",',
               '"name": "Start Pos Switcher",\n\t    "desc": "Shows arrows in the level to switch between StartPos objects (or None to start from the beginning).",\n        "type": "bool"\n\t},\n    {\n\t    "name": "Copy Hack",')])
          # No Ghost Trail: oculta el efecto fantasma del jugador
          with open(f"{root}/src/Hacks/Player.cpp", "a", encoding="utf-8") as fh:
              fh.write("""
          #include <Geode/modify/GhostTrailEffect.hpp>
          class $modify(PrismNoGhostTrail, GhostTrailEffect) {
              void trailSnapshot(float dt) {
                  if (Hacks::isHackEnabled("No Ghost Trail")) return;
                  GhostTrailEffect::trailSnapshot(dt);
              }
          };
          """)
          sub("resources/hacks/player.json", [
              ('"name": "No Trail",',
               '"name": "No Ghost Trail",\n        "desc": "Hides the ghost trail of the player.",\n        "type": "bool"\n    },\n    {\n        "name": "No Trail",')])
          # Menu Prism: (1) el ScrollLayer de Geode oculta los hijos cuyo rectangulo sale de la vista; m_content era un menu de
          # tamano pantalla desplazado, y al bajar mucho se ocultaba entero -> se le da un tamano enorme.
          # (2) el boton "!" crasheaba (punteros sin inicializar / busqueda de nodos por nombre): popup simple y seguro.
          sub("src/UI/PrismUI.cpp", [("m_content->setZOrder(2);", "m_content->setZOrder(2);\n    m_content->setContentSize({320.F, 3000.F});")])
          p = f"{root}/src/UI/PrismUI.cpp"
          t = open(p, encoding="utf-8").read()
          i = t.index("void PrismUIButton::onInfoBtn(CCObject* ret) {")
          j = t.index("matjson::Value PrismUI::GetTheme() {")
          t = t[:i] + """\
          void PrismUIButton::onInfoBtn(CCObject* ret) {
              auto node = typeinfo_cast<CCNode*>(ret);
              if (!node) return;
              HackItem* hack = static_cast<HackItem*>(node->getUserData());
              if (!hack) return;
              auto currentLanguage = Lang::getLanguage();
              auto name = currentLanguage->name(hack->name);
              auto desc = currentLanguage->desc(hack->name, hack->desc);
              FLAlertLayer::create(name.c_str(), desc, "OK")->show();
          }

          """ + t[j:]
          open(p, "w", encoding="utf-8").write(t)
          print("parcheado onInfoBtn")
          # Hitboxes "on death" del juego: el hook de PlayLayer::updateVisibility ocultaba m_debugDrawNode siempre que no estuviera
          # activo un hack de Prism -> anulaba la opcion vanilla. Ahora solo lo oculta si lo mostro Prism.
          sub("src/Hacks/Misc.cpp", [
              ("class $modify(PLMiscHacks, PlayLayer) {\n    void updateVisibility(float p0) {",
               "class $modify(PLMiscHacks, PlayLayer) {\n    struct Fields {\n        bool prismShown = false;\n    };\n    void updateVisibility(float p0) {"),
              ("            if (!m_debugDrawNode->isVisible()) m_debugDrawNode->setVisible(true);\n",
               "            if (!m_debugDrawNode->isVisible()) m_debugDrawNode->setVisible(true);\n            m_fields->prismShown = true;\n"),
              ("        else if (m_debugDrawNode->isVisible() && !(m_isPracticeMode && m_isDebugDrawEnabled))\n            m_debugDrawNode->setVisible(false);",
               "        else if (m_fields->prismShown) {\n            m_fields->prismShown = false;\n            if (!(m_isPracticeMode && m_isDebugDrawEnabled) && !(m_player1 && m_player1->m_isDead)) m_debugDrawNode->setVisible(false);\n        }")])
          # el hook global de CCDrawNode::drawPolygon (Solid Wave Trail antiguo) cambiaba el z-order y la mezcla de TODOS los draw nodes
          # (incluidos los hitboxes); la wave ya no usa drawPolygon, asi que se elimina
          import re as _re
          pp = f"{root}/src/Hacks/Player.cpp"
          tt = open(pp, encoding="utf-8").read()
          tt2 = _re.sub(r"class \$modify\(CCDrawNode\) \{.*?\n\};\n", "", tt, count=1, flags=_re.S)
          print("hook CCDrawNode eliminado:", tt2 != tt)
          open(pp, "w", encoding="utf-8").write(tt2)
          # file::pick devuelve Result<optional<asp Path>>
          sub("src/UI/PrismUI.cpp", [("[](Result<std::optional<std::filesystem::path>> result) {", "[](auto result) {"),
                                     ("auto path = opt.value();", "std::filesystem::path path = opt.value().string();")])
          PY

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Geode CLI profile
        run: |
          CLI_PROFILE="$GITHUB_WORKSPACE/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win

      - name: Clone Geode SDK (${{ env.GEODE_REF }})
        run: |
          git clone --depth 1 --branch "$GEODE_REF" --recurse-submodules --shallow-submodules \
            https://github.com/geode-sdk/geode "$GITHUB_WORKSPACE/geode-sdk-clone"
          echo "GEODE_SDK=$GITHUB_WORKSPACE/geode-sdk-clone" >> "$GITHUB_ENV"
          git -C geode-sdk-clone log -1 --format='Geode %h %ad %s' --date=short
          grep -n "android:" geode-sdk-clone/CMakeLists.txt | head -2

      # Las bindings de geode-sdk/bindings (main) estan en obras para 2.209x y a veces quedan rotas entre commits
      # (el 21-oct el commit 7229495 quito miembros de EditorPauseLayer y dejo su inline sin actualizar).
      # Se fija un commit conocido que compila y se usa en el loader y en el mod.
      - name: Clonar bindings (commit fijo)
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/geode-sdk/bindings "$GITHUB_WORKSPACE/bindings-clone"
          git -C "$GITHUB_WORKSPACE/bindings-clone" checkout "$BINDINGS_REF"
          # HardStreak::appendQuad esta como TodoReturn (no se puede hookear); en 2.2091 devuelve void
          sed -i 's/TodoReturn appendQuad(cocos2d::CCPoint const\*/void appendQuad(cocos2d::CCPoint const*/' "$GITHUB_WORKSPACE/bindings-clone/bindings/2.2091/GeometryDash.bro"
          grep -n "appendQuad" "$GITHUB_WORKSPACE/bindings-clone/bindings/2.2091/GeometryDash.bro"
          git -C "$GITHUB_WORKSPACE/bindings-clone" log -1 --format='bindings %h %ad %s' --date=short
          echo "GEODE_BINDINGS_REPO_PATH=$GITHUB_WORKSPACE/bindings-clone" >> "$GITHUB_ENV"

      # El mod se enlaza contra Geode.android64.so: se compila el loader de la misma rama.
      # (Directorio de build distinto de "build": el CMake del mod usa $GEODE_SDK/build para el SDK.)
      - name: Build Geode loader (link target)
        shell: bash
        run: |
          set -o pipefail
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          cd "$GEODE_SDK"
          cmake -B loader-build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DANDROID_PLATFORM=android-23 -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a \
            -DGEODE_BINDINGS_REPO_PATH="$GEODE_BINDINGS_REPO_PATH" \
            -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP_VERSION" 2>&1 | tee "$GITHUB_WORKSPACE/loader.log"
          cmake --build loader-build --parallel -- -k 0 2>&1 | tee -a "$GITHUB_WORKSPACE/loader.log"
          ls -la bin/nightly/Geode.android64.so

      - name: Errores del loader (resumen)
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "## Errores al compilar el loader"
            echo '```'
            grep -n -B1 -A12 -E 'FAILED:|error:|CMake Error|undefined reference|ld: error|fatal error' loader.log | head -150
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diagnostico de asp2 (CPM)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "SDK: $(git -C geode-sdk-clone log -1 --format='%h %ad %s' --date=short)"
          grep -n 'GEODE_ASP_VERSION "' geode-sdk-clone/CMakeLists.txt || true
          ls cpm-cache/asp2 || true
          ls cpm-cache/asp2/*/include/asp/fs/Path.hpp || echo "FALTA asp/fs/Path.hpp en asp2"

      - name: Ajustar la version de Geode en mod.json a la del SDK
        shell: bash
        run: |
          V=$(tr -d '[:space:]' < "$GEODE_SDK/VERSION")
          echo "Version del SDK: $V"
          sed -i -E "s/(\"geode\"[[:space:]]*:[[:space:]]*)\"[^\"]*\"/\1\"$V\"/" mod_src/mod.json
          grep -n '"geode"' mod_src/mod.json

      - name: Build mod
        shell: bash
        run: |
          NDK=/usr/local/lib/android/sdk/ndk/29.0.14206865
          [ -d "$NDK" ] || NDK="$ANDROID_NDK_LATEST_HOME"
          cd mod_src
          set +e
          {
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
              -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Android64 \
              -DGEODE_GD_VERSION="$GD_VERSION" -DGEODE_COMP_GD_VERSION="$GD_COMP_VERSION" \
              -DGEODE_BINDINGS_REPO_PATH="$GEODE_BINDINGS_REPO_PATH" \
            && cmake --build build --config Release --parallel -- -k 0
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## Error compilando Prism Menu"
              echo '```'
              grep -E '^/.*(error|fatal error):|CMake Error|undefined reference|ld: error' "$GITHUB_WORKSPACE/build.log" | sed 's|/home/runner/work/[^/]*/[^/]*/||' | sort -u | cut -c1-260 | head -250
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          # el paquete .geode lo genera un target aparte (<proyecto>_PACKAGE); si no salio, se construye explicitamente
          if [ -z "$(find . -name '*.geode' -not -path './build/CMakeFiles/*' | head -1)" ]; then
            echo "No hay .geode todavia; objetivos de paquete disponibles:"
            ninja -C build -t targets all | grep -i -E "package|\.geode" | head -20
            cmake --build build --target PrismMenu_PACKAGE 2>&1 | tail -20 || true
          fi
          echo "== .geode y .so encontrados =="
          find . \( -name '*.geode' -o -name '*android64.so' -o -name 'PrismMenu*.so' \) -not -path './build/CMakeFiles/*' | head -20
          find . -name '*.geode' -not -path './build/CMakeFiles/*' -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          ls -la "$GITHUB_WORKSPACE/output"

      - name: Upload build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: prism-build-logs
          path: |
            build.log
            loader.log
          if-no-files-found: ignore

      - name: Resumen de archivos generados
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## Archivos generados"
            echo '```'
            echo "-- output/ --"; ls -la output 2>&1
            echo "-- .geode / .so / .zip en mod_src --"
            find mod_src -type f \( -name '*.geode' -o -name '*.so' -o -name '*.zip' \) -not -path '*/CMakeFiles/*' -not -path '*/cpm-cache/*' -printf '%p  %s bytes\n' 2>&1 | head -30
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: prism-android64-2.2091
          path: |
            output/
            mod_src/build/*.geode
          if-no-files-found: error
